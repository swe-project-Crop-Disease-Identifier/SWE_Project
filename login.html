<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Crop Disease Identifier</title>
  <meta name="description" content="Sign in to Crop Disease Identifier to protect your crops with AI-powered disease detection.">
  <meta name="theme-color" content="#1E8E4E">
  <link rel="icon" type="image/png" href="assets/icons/logo (2).png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap">
  <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page" data-page="login">

  <!-- ── Farmland background ── -->
  <div class="auth-bg" aria-hidden="true"></div>

  <!-- ── Language Toggle ── -->
  <div class="auth-lang">
    <button class="auth-lang-btn" id="lang-toggle" type="button" aria-label="Switch language">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
      <span id="lang-label" data-i18n="auth.lang.bn">বাংলা</span>
    </button>
  </div>

  <!-- ── Login Card ── -->
  <main class="auth-card" role="main" aria-label="Login form">

    <!-- Global error alert -->
    <div class="auth-alert auth-alert--error" id="global-alert" role="alert">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/>
      </svg>
      <span id="global-alert-text"></span>
    </div>

    <!-- Logo -->
    <div class="auth-header">
      <a href="index.html" class="auth-logo" aria-label="Crop Disease Identifier — go to home">
        <img src="assets/icons/logo (2).png" alt="Logo" class="auth-logo__img">
        <div class="auth-logo__name">
          Crop Disease
          <span data-i18n="auth.brand.sub">Identifier</span>
        </div>
      </a>
      <h1 class="auth-heading" data-i18n="auth.login.heading">Welcome Back!</h1>
      <p class="auth-subheading" data-i18n="auth.login.sub">Sign in to continue protecting your crops.</p>
    </div>

    <!-- Login Form -->
    <form class="auth-form" id="login-form" novalidate autocomplete="on">

      <!-- Email -->
      <div class="field-group">
        <label class="field-label" for="login-email" data-i18n="auth.email.label">Email Address</label>
        <div class="field-wrap">
          <input
            class="auth-input"
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            inputmode="email"
            placeholder="you@example.com"
            aria-required="true"
            data-i18n-placeholder="auth.email.placeholder">
        </div>
        <span class="field-error" id="email-error" role="alert">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          <span data-i18n="auth.email.error">Please enter a valid email address.</span>
        </span>
      </div>

      <!-- Password -->
      <div class="field-group">
        <label class="field-label" for="login-password" data-i18n="auth.password.label">Password</label>
        <div class="field-wrap field-wrap--password">
          <input
            class="auth-input"
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            placeholder="••••••••"
            aria-required="true"
            data-i18n-placeholder="auth.password.placeholder">
          <button class="pw-toggle" type="button" aria-label="Show password" data-target="login-password">
            <!-- Eye open -->
            <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <!-- Eye closed (shown when password visible) -->
            <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none">
              <path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-7 0-11-7-11-7a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.8 9.8 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.2 3M1 1l22 22"/>
            </svg>
          </button>
        </div>
        <span class="field-error" id="password-error" role="alert">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg>
          <span data-i18n="auth.password.error">Password must be at least 6 characters.</span>
        </span>
      </div>

      <!-- Remember me + Forgot -->
      <div class="auth-row">
        <label class="auth-checkbox">
          <input type="checkbox" id="remember-me" name="remember">
          <span data-i18n="auth.remember">Remember me</span>
        </label>
        <a href="#" class="auth-forgot" id="forgot-link" data-i18n="auth.forgot">Forgot password?</a>
      </div>

      <!-- Submit -->
      <button class="btn-auth" type="submit" id="login-btn">
        <span class="spinner" aria-hidden="true"></span>
        <span class="btn-label" data-i18n="auth.login.btn">Log In</span>
      </button>

    </form>

    <!-- OR divider -->
    <div class="auth-divider" data-i18n="auth.or">or</div>

    <!-- Social buttons -->
    <!-- ⚠️ API PLACEHOLDER: Replace onclick with real Google OAuth flow -->
    <button class="btn-social" type="button" id="google-btn" onclick="handleGoogleAuth()">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M24 9.5c3.6 0 6.5 1.3 8.7 3.4l6.4-6.4C35.2 2.6 29.9 0 24 0 14.7 0 6.8 5.4 2.9 13.3l7.5 5.8C12.2 13.3 17.6 9.5 24 9.5z"/>
        <path fill="#34A853" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.4c-.5 2.8-2.1 5.1-4.5 6.7l7 5.4c4.1-3.8 6.5-9.3 6.5-16.1z"/>
        <path fill="#FBBC05" d="M10.4 28.6A14.5 14.5 0 0 1 9.5 24c0-1.6.3-3.2.9-4.6L2.9 13.6A24 24 0 0 0 0 24c0 3.8.9 7.4 2.9 10.4l7.5-5.8z"/>
        <path fill="#EA4335" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7-5.4c-2.1 1.4-4.8 2.3-8.9 2.3-6.4 0-11.8-3.8-13.6-9.4l-7.5 5.8C6.8 42.6 14.7 48 24 48z"/>
      </svg>
      <span data-i18n="auth.google">Continue with Google</span>
    </button>

    <!-- ⚠️ API PLACEHOLDER: Replace onclick with real Apple OAuth flow -->
    <button class="btn-social" type="button" id="apple-btn" onclick="handleAppleAuth()" style="margin-top:.6rem">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M18.7 12.4c0-3 2.5-4.5 2.6-4.6-1.4-2-3.6-2.3-4.4-2.4-1.9-.2-3.6 1.1-4.6 1.1-.9 0-2.4-1.1-4-1-2 0-3.9 1.2-4.9 3-2.1 3.6-.5 9 1.5 11.9 1 1.4 2.1 3 3.6 3 1.5-.1 2-.9 3.8-.9s2.3.9 3.8.9c1.5 0 2.5-1.4 3.5-2.8.5-.8.9-1.5 1.3-2.4-3.3-1.3-3.2-5.8-.2-6.8zm-3-8.6c.8-1 1.4-2.3 1.2-3.7-1.2.1-2.6.8-3.4 1.8-.7.9-1.4 2.2-1.2 3.6 1.3.1 2.6-.6 3.4-1.7z"/>
      </svg>
      <span data-i18n="auth.apple">Continue with Apple</span>
    </button>

    <!-- Sign up link -->
    <p class="auth-footer-text" style="margin-top:1.25rem">
      <span data-i18n="auth.no.account">Don't have an account?</span>
      <a href="register.html" data-i18n="auth.signup.link"> Sign Up</a>
    </p>

    <!-- Back to Home -->
    <a href="index.html" class="auth-back">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
        <path d="M19 12H5m0 0 6-6m-6 6 6 6"/>
      </svg>
      <span data-i18n="auth.back.home">Back to Home</span>
    </a>

  </main>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
